name: Deploy

# Despliega Rumbo en el servidor por SSH cada vez que se sube un cambio a main.
# También se puede lanzar a mano desde la pestaña "Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

# Nunca dos despliegues a la vez; si entra uno nuevo, cancela el anterior.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar sintaxis PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Configurar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi

      - name: Subir archivos con rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # data/ queda fuera: así no se pisan los reportes ni la caché de precios del servidor.
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='data/' \
            -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT" \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

          # Asegurar que data/ existe y que PHP puede escribir en ella.
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$DEPLOY_PATH/data' && chmod 775 '$DEPLOY_PATH/data'"

      - name: Limpiar clave
        if: always()
        run: rm -f ~/.ssh/id_deploy
